<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STAY HUSTLE — No Rules. Just Style.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#D92323',
              black: '#0A0A0A',
              offwhite: '#F8F8F8',
              cream: '#F5F0E8',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Space Grotesk', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow-x: hidden; background: #F8F8F8; }
    .ticker-track {
      display: flex;
      width: max-content;
      animation: ticker 28s linear infinite;
    }
    @keyframes ticker {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .hoodie-side {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .glow-red {
      box-shadow: 0 0 40px 8px rgba(217, 35, 35, 0.45), 0 0 80px 20px rgba(217, 35, 35, 0.15);
    }
    .pulse-glow {
      animation: pulseGlow 2.2s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 12px rgba(217,35,35,0.7)); }
      50% { transform: scale(1.08); opacity: 0.85; filter: drop-shadow(0 0 28px rgba(217,35,35,0.95)); }
    }
    .cart-drawer {
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .size-btn.active {
      background: #D92323;
      color: white;
      border-color: #D92323;
    }
    .rail-shadow {
      box-shadow: 0 8px 24px -4px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.3);
    }
    /* Simple hoodie shape via CSS */
    .hoodie-body {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 8px 8px 4px 4px;
      overflow: hidden;
    }
    .hoodie-hood {
      position: absolute;
      top: -8%;
      left: 15%;
      width: 70%;
      height: 22%;
      border-radius: 50% 50% 40% 40%;
      background: inherit;
      filter: brightness(0.92);
    }
    .hoodie-pocket {
      position: absolute;
      bottom: 18%;
      left: 22%;
      width: 56%;
      height: 16%;
      border: 1.5px solid rgba(0,0,0,0.15);
      border-radius: 4px;
      background: rgba(0,0,0,0.04);
    }
    .hoodie-print {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
      white-space: nowrap;
    }
    .view-3d {
      perspective: 1200px;
    }
    .rotate-y {
      transform-style: preserve-3d;
      transition: transform 0.15s linear;
    }
  </style>
</head>
<body class="font-sans text-brand-black antialiased">
  <div id="root"></div>

  <!-- React + Framer Motion via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/framer-motion@11.0.0/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    const { motion, AnimatePresence, useMotionValue, useSpring, useTransform } = Motion;

    // Brand colors for hoodies
    const HOODIES = [
      { id: 1, name: "LIGHT GREY", color: "#D1D5DB", accent: "#9CA3AF", label: "Ash" },
      { id: 2, name: "DARK CHARCOAL", color: "#2D2D2D", accent: "#1A1A1A", label: "Charcoal" },
      { id: 3, name: "FOREST GREEN", color: "#1B4332", accent: "#0F2A1F", label: "Forest" },
      { id: 4, name: "MEDIUM GREY", color: "#6B7280", accent: "#4B5563", label: "Steel" },
      { id: 5, name: "CREAM", color: "#F5F0E8", accent: "#E8DFD0", label: "Cream" },
      { id: 6, name: "BURGUNDY", color: "#4A0E0E", accent: "#2A0808", label: "Burgundy" },
    ];

    // Preloader Component
    function Preloader({ onComplete }) {
      useEffect(() => {
        const t = setTimeout(onComplete, 2800);
        return () => clearTimeout(t);
      }, [onComplete]);

      return (
        <motion.div
          className="fixed inset-0 z-[100] bg-[#0A0A0A] flex items-center justify-center"
          exit={{ opacity: 0, scale: 1.05 }}
          transition={{ duration: 0.7, ease: [0.22, 1, 0.36, 1] }}
        >
          <motion.div
            className="relative flex flex-col items-center"
            initial={{ opacity: 0, scale: 0.7 }}
            animate={{ opacity: 1, scale: 1 }}
            transition={{ duration: 0.6, ease: "easeOut" }}
          >
            {/* Glowing Red Emblem */}
            <div className="pulse-glow">
              <svg width="96" height="96" viewBox="0 0 96 96" fill="none">
                <circle cx="48" cy="48" r="44" stroke="#D92323" strokeWidth="3" />
                <path d="M30 58 L48 28 L66 58 Z" fill="#D92323" />
                <rect x="40" y="52" width="16" height="18" rx="2" fill="#D92323" />
              </svg>
            </div>
            <motion.p
              className="mt-6 text-[#D92323] tracking-[0.35em] text-xs font-semibold uppercase"
              initial={{ opacity: 0 }}
              animate={{ opacity: 1 }}
              transition={{ delay: 0.4 }}
            >
              STAY HUSTLE
            </motion.p>
          </motion.div>
        </motion.div>
      );
    }

    // Ticker
    function Ticker() {
      const text = "FREE SHIPPING ON ORDERS OVER $150  •  WORLDWIDE DELIVERY  •  LIMITED DROP  •  NO RULES JUST STYLE  •  ";
      return (
        <div className="bg-brand-black text-white text-[10px] tracking-[0.2em] uppercase overflow-hidden h-7 flex items-center">
          <div className="ticker-track">
            <span className="px-4 whitespace-nowrap">{text}</span>
            <span className="px-4 whitespace-nowrap">{text}</span>
            <span className="px-4 whitespace-nowrap">{text}</span>
            <span className="px-4 whitespace-nowrap">{text}</span>
          </div>
        </div>
      );
    }

    // Header
    function Header({ cartCount, onOpenCart }) {
      return (
        <header className="sticky top-0 z-50 bg-[#F8F8F8]/90 backdrop-blur-md border-b border-black/5">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
            <nav className="flex gap-6 text-xs font-semibold tracking-widest uppercase">
              <a href="#collection" className="hover:text-brand-red transition-colors">Collection</a>
              <a href="#about" className="hover:text-brand-red transition-colors">About</a>
            </nav>

            {/* Center Logo - tilted */}
            <div className="absolute left-1/2 -translate-x-1/2">
              <div className="transform -rotate-3 origin-center">
                <span className="font-display font-bold text-lg tracking-tighter">
                  <span className="text-brand-red">STAY</span>
                  <span className="text-brand-black"> HUSTLE</span>
                </span>
              </div>
            </div>

            <button
              onClick={onOpenCart}
              className="flex items-center gap-2 text-xs font-semibold tracking-widest uppercase hover:text-brand-red transition-colors group"
            >
              <svg className="w-4 h-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
              </svg>
              BAG ({cartCount})
            </button>
          </div>
        </header>
      );
    }

    // Single Hoodie on the rack
    function HoodieItem({ hoodie, index, activeIndex, onHover, onSelect }) {
      const isActive = activeIndex === index;
      const offset = isActive ? 0 : (index - (activeIndex ?? 2.5)) * 22;

      return (
        <motion.div
          className="relative flex-shrink-0 cursor-pointer"
          style={{
            width: isActive ? 148 : 98,
            zIndex: isActive ? 30 : 10 - Math.abs(index - (activeIndex ?? 2)),
            perspective: "900px",
          }}
          onMouseEnter={() => onHover(index)}
          onClick={() => onSelect(hoodie)}
          animate={{
            x: offset,
            scale: isActive ? 1.22 : 0.88,
            rotateY: isActive ? 0 : -55,
            y: isActive ? -22 : 4,
          }}
          transition={{ type: "spring", stiffness: 320, damping: 24, mass: 0.75 }}
        >
          <div
            className="relative h-48 sm:h-56 rounded-md shadow-xl border border-black/10"
            style={{
              background: `linear-gradient(155deg, ${hoodie.color} 0%, ${hoodie.accent} 100%)`,
              transformStyle: "preserve-3d",
            }}
          >
            {/* Hood silhouette */}
            <div
              className="absolute -top-2 left-1/2 -translate-x-1/2 w-[72%] h-9 rounded-t-[40%]"
              style={{ background: hoodie.accent, boxShadow: "inset 0 -6px 10px rgba(0,0,0,0.2)" }}
            />
            {/* Sleeve hints for side view */}
            {!isActive && (
              <div
                className="absolute top-10 -right-3 w-6 h-24 rounded-r-md opacity-70"
                style={{ background: hoodie.accent }}
              />
            )}
            {/* Pocket */}
            <div className="absolute bottom-8 left-1/2 -translate-x-1/2 w-[52%] h-7 border border-black/25 rounded-sm bg-black/8" />
            {/* Small label on chest when active */}
            {isActive && (
              <div className="absolute top-[42%] left-1/2 -translate-x-1/2 text-[9px] font-bold tracking-widest text-white/80 drop-shadow">
                SH
              </div>
            )}
          </div>
          {/* Side profile shading */}
          {!isActive && (
            <div className="absolute inset-0 bg-gradient-to-l from-black/25 via-transparent to-transparent rounded-md pointer-events-none" />
          )}
          {/* Label when active - outside overflow */}
          {isActive && (
            <motion.div
              initial={{ opacity: 0, y: 10 }}
              animate={{ opacity: 1, y: 0 }}
              transition={{ delay: 0.08 }}
              className="absolute -bottom-12 left-1/2 -translate-x-1/2 whitespace-nowrap z-40 pointer-events-none"
            >
              <span className="bg-brand-black text-white text-[10px] font-semibold tracking-widest px-3.5 py-1.5 rounded-full shadow-lg">
                VIEW PRODUCT →
              </span>
            </motion.div>
          )}
        </motion.div>
      );
    }

    // Interactive Rail
    function ClothesRail({ onSelectProduct }) {
      const [activeIndex, setActiveIndex] = useState(2);

      return (
        <section className="relative py-10 sm:py-16 overflow-hidden">
          <div className="max-w-5xl mx-auto px-4 text-center mb-10">
            <h1 className="font-display text-4xl sm:text-6xl md:text-7xl font-bold tracking-tighter leading-none">
              <span className="text-brand-black">NO RULES.</span>
              <br />
              <span className="text-brand-red">JUST STYLE.</span>
            </h1>
            <p className="mt-4 text-sm sm:text-base text-black/60 max-w-md mx-auto leading-relaxed">
              Oversized heavyweight essentials.<br />
              Built for the streets. Made to last.
            </p>
          </div>

          {/* Metallic Rail */}
          <div className="relative max-w-4xl mx-auto px-2">
            {/* Rail bar */}
            <div className="absolute top-1 left-6 right-6 h-3 rounded-full bg-gradient-to-b from-[#c0c0c0] via-[#8a8a8a] to-[#6a6a6a] rail-shadow z-0" 
                 style={{ boxShadow: "0 4px 12px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.4)" }} />
            {/* Supports */}
            <div className="absolute top-0 left-10 w-2 h-5 bg-gradient-to-b from-gray-400 to-gray-600 rounded-sm" />
            <div className="absolute top-0 right-10 w-2 h-5 bg-gradient-to-b from-gray-400 to-gray-600 rounded-sm" />

            {/* Hoodies container */}
            <div
              className="relative flex items-end justify-center gap-0 sm:gap-1 pt-8 pb-28 min-h-[320px]"
              style={{ perspective: "1000px" }}
              onMouseLeave={() => setActiveIndex(2)}
            >
              {HOODIES.map((h, i) => (
                <HoodieItem
                  key={h.id}
                  hoodie={h}
                  index={i}
                  activeIndex={activeIndex}
                  onHover={setActiveIndex}
                  onSelect={onSelectProduct}
                />
              ))}
            </div>
          </div>
        </section>
      );
    }

    // Product Detail Page
    function ProductDetail({ product, onBack, onAddToCart }) {
      const [size, setSize] = useState("M");
      const [rotation, setRotation] = useState(0); // 0-360
      const [viewMode, setViewMode] = useState("2d"); // 2d | 3d
      const [isAdding, setIsAdding] = useState(false);

      const handleAdd = () => {
        setIsAdding(true);
        onAddToCart({ ...product, size, price: 115 });
        setTimeout(() => setIsAdding(false), 600);
      };

      // Map rotation to face: 0 front, 90 side, 180 back
      const face = useMemo(() => {
        const r = ((rotation % 360) + 360) % 360;
        if (r < 45 || r >= 315) return "front";
        if (r < 135) return "side";
        if (r < 225) return "back";
        return "side";
      }, [rotation]);

      return (
        <motion.div
          className="min-h-screen bg-[#F8F8F8]"
          initial={{ opacity: 0, y: 24 }}
          animate={{ opacity: 1, y: 0 }}
          exit={{ opacity: 0, y: -16 }}
          transition={{ duration: 0.45, ease: [0.22, 1, 0.36, 1] }}
        >
          {/* Sub header */}
          <div className="max-w-6xl mx-auto px-4 pt-6">
            <button
              onClick={onBack}
              className="text-xs font-semibold tracking-widest uppercase text-black/70 hover:text-brand-red transition-colors flex items-center gap-2"
            >
              ← BACK TO RACK
            </button>
          </div>

          <div className="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-16">
            {/* LEFT: Product Stage */}
            <div>
              <div className="relative bg-gray-100 rounded-2xl overflow-hidden aspect-[4/5] flex items-center justify-center">
                {/* Badges */}
                <span className="absolute top-4 left-4 bg-brand-black text-white text-[10px] font-bold tracking-widest px-3 py-1 rounded-full">
                  LIMITED DROP
                </span>
                <button className="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/80 flex items-center justify-center hover:bg-white transition">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                  </svg>
                </button>

                {/* Garment visual */}
                <div
                  className={`relative w-56 h-72 sm:w-64 sm:h-80 ${viewMode === "3d" ? "view-3d" : ""}`}
                  style={viewMode === "3d" ? { transform: `rotateY(${rotation}deg)` } : {}}
                >
                  <div
                    className="w-full h-full rounded-lg shadow-2xl relative overflow-hidden"
                    style={{
                      background: `linear-gradient(160deg, ${product.color} 0%, ${product.accent} 100%)`,
                      transform: viewMode === "2d" ? `rotateY(${rotation * 0.4}deg)` : undefined,
                      transition: "transform 0.12s linear",
                    }}
                  >
                    {/* Hood */}
                    <div
                      className="absolute -top-4 left-1/2 -translate-x-1/2 w-[68%] h-10 rounded-t-full"
                      style={{ background: product.accent }}
                    />
                    {/* Front or Back print */}
                    {face === "back" ? (
                      <div className="absolute inset-0 flex items-center justify-center">
                        <div className="text-center">
                          <p className="font-display font-bold text-white/95 text-xl tracking-widest drop-shadow-md">
                            STAY
                          </p>
                          <p className="font-display font-bold text-white/95 text-xl tracking-widest drop-shadow-md -mt-1">
                            HUSTLE
                          </p>
                        </div>
                      </div>
                    ) : (
                      <div className="absolute bottom-10 left-1/2 -translate-x-1/2 w-[52%] h-8 border border-black/25 rounded bg-black/5" />
                    )}
                    {/* Side shading */}
                    {face === "side" && (
                      <div className="absolute inset-0 bg-gradient-to-r from-black/20 to-transparent" />
                    )}
                  </div>
                </div>
              </div>

              {/* 360 Slider */}
              <div className="mt-5 px-1">
                <div className="flex items-center gap-3">
                  <span className="text-[10px] font-bold tracking-widest text-black/50">360°</span>
                  <input
                    type="range"
                    min="0"
                    max="360"
                    value={rotation}
                    onChange={(e) => setRotation(Number(e.target.value))}
                    className="flex-1 h-1.5 bg-gray-200 rounded-full appearance-none cursor-pointer
                      [&::-webkit-slider-thumb]:appearance-none
                      [&::-webkit-slider-thumb]:w-4
                      [&::-webkit-slider-thumb]:h-4
                      [&::-webkit-slider-thumb]:rounded-full
                      [&::-webkit-slider-thumb]:bg-brand-red
                      [&::-webkit-slider-thumb]:shadow-md
                      [&::-webkit-slider-thumb]:cursor-grab
                      [&::-moz-range-thumb]:w-4
                      [&::-moz-range-thumb]:h-4
                      [&::-moz-range-thumb]:rounded-full
                      [&::-moz-range-thumb]:bg-brand-red
                      [&::-moz-range-thumb]:border-0"
                  />
                </div>
              </div>

              {/* View Mode Toggle */}
              <div className="mt-4 flex gap-2">
                <button
                  onClick={() => setViewMode("2d")}
                  className={`px-4 py-2 rounded-full text-xs font-semibold tracking-wide transition-all ${
                    viewMode === "2d"
                      ? "bg-brand-black text-white"
                      : "bg-white border border-black/10 text-black/70 hover:border-black/30"
                  }`}
                >
                  2D VIEW
                </button>
                <button
                  onClick={() => setViewMode("3d")}
                  className={`px-4 py-2 rounded-full text-xs font-semibold tracking-wide transition-all flex items-center gap-1.5 ${
                    viewMode === "3d"
                      ? "bg-brand-black text-white"
                      : "bg-white border border-black/10 text-black/70 hover:border-black/30"
                  }`}
                >
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                  </svg>
                  3D MODEL
                </button>
              </div>
            </div>

            {/* RIGHT: Specs */}
            <div className="flex flex-col">
              <div className="flex items-start justify-between gap-4">
                <h2 className="font-display text-2xl sm:text-3xl font-bold tracking-tight uppercase leading-tight">
                  Stay Hustle<br />Oversized Hoodie
                </h2>
                <span className="text-2xl font-bold whitespace-nowrap">$115</span>
              </div>

              <div className="mt-3 flex items-center gap-3 text-xs">
                <span className="bg-emerald-100 text-emerald-700 font-semibold px-2.5 py-1 rounded-full">
                  IN STOCK
                </span>
                <span className="text-black/50 font-medium">SHIPS IN 24 HOURS</span>
              </div>

              <p className="mt-5 text-sm text-black/70 leading-relaxed max-w-md">
                480gsm heavyweight cotton fleece with a boxy oversized fit. 
                Soft brushed interior, reinforced seams, and a high-density puff print 
                graphic on the back that reads “STAY HUSTLE”. Built for daily wear.
              </p>

              {/* Size Selector */}
              <div className="mt-8">
                <div className="flex items-center justify-between mb-3">
                  <span className="text-xs font-bold tracking-widest uppercase">Select Size</span>
                  <button className="text-[11px] font-medium text-black/50 underline hover:text-brand-red">
                    Size Guide
                  </button>
                </div>
                <div className="flex gap-2">
                  {["S", "M", "L", "XL"].map((s) => (
                    <button
                      key={s}
                      onClick={() => setSize(s)}
                      className={`w-12 h-12 rounded-lg border-2 text-sm font-semibold transition-all ${
                        size === s
                          ? "border-brand-red bg-brand-red text-white"
                          : "border-black/15 hover:border-black/40"
                      }`}
                    >
                      {s}
                    </button>
                  ))}
                </div>
              </div>

              {/* CTA */}
              <button
                onClick={handleAdd}
                disabled={isAdding}
                className="mt-8 w-full h-14 bg-brand-black text-white font-semibold tracking-widest uppercase text-sm rounded-lg
                  hover:-translate-y-0.5 hover:shadow-xl active:translate-y-0 transition-all duration-200
                  disabled:opacity-70 flex items-center justify-center gap-2"
              >
                {isAdding ? (
                  <>
                    <svg className="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                      <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                      <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
                    </svg>
                    ADDED
                  </>
                ) : (
                  `ADD TO BAG — $115`
                )}
              </button>

              {/* Specs Accordion-like */}
              <ul className="mt-8 space-y-3 text-sm text-black/70">
                <li className="flex items-center gap-3">
                  <span className="w-5 h-5 rounded-full bg-black/5 flex items-center justify-center text-[10px]">✓</span>
                  100% Heavyweight Cotton Fleece
                </li>
                <li className="flex items-center gap-3">
                  <span className="w-5 h-5 rounded-full bg-black/5 flex items-center justify-center text-[10px]">✓</span>
                  Free Express Worldwide Shipping
                </li>
                <li className="flex items-center gap-3">
                  <span className="w-5 h-5 rounded-full bg-black/5 flex items-center justify-center text-[10px]">✓</span>
                  30-Day Easy Returns
                </li>
              </ul>
            </div>
          </div>
        </motion.div>
      );
    }

    // Cart Drawer
    function CartDrawer({ open, onClose, items, onRemove }) {
      const total = items.reduce((sum, i) => sum + i.price, 0);

      return (
        <AnimatePresence>
          {open && (
            <>
              <motion.div
                className="fixed inset-0 bg-black/40 z-[60]"
                initial={{ opacity: 0 }}
                animate={{ opacity: 1 }}
                exit={{ opacity: 0 }}
                onClick={onClose}
              />
              <motion.div
                className="fixed top-0 right-0 h-full w-full max-w-md bg-white z-[70] shadow-2xl flex flex-col"
                initial={{ x: "100%" }}
                animate={{ x: 0 }}
                exit={{ x: "100%" }}
                transition={{ type: "spring", stiffness: 320, damping: 32 }}
              >
                <div className="flex items-center justify-between px-6 h-16 border-b border-black/5">
                  <h3 className="font-display font-bold text-lg tracking-tight">YOUR BAG</h3>
                  <button onClick={onClose} className="text-xs font-semibold tracking-widest hover:text-brand-red">
                    CLOSE
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto px-6 py-4">
                  {items.length === 0 ? (
                    <p className="text-sm text-black/50 mt-8 text-center">Your bag is empty.</p>
                  ) : (
                    <ul className="space-y-4">
                      {items.map((item, idx) => (
                        <li key={idx} className="flex gap-4">
                          <div
                            className="w-16 h-20 rounded-md flex-shrink-0"
                            style={{ background: `linear-gradient(160deg, ${item.color} 0%, ${item.accent} 100%)` }}
                          />
                          <div className="flex-1 min-w-0">
                            <p className="text-sm font-semibold truncate">Stay Hustle Oversized Hoodie</p>
                            <p className="text-xs text-black/50 mt-0.5">{item.label} / {item.size}</p>
                            <p className="text-sm font-medium mt-1">${item.price}</p>
                          </div>
                          <button
                            onClick={() => onRemove(idx)}
                            className="text-xs text-black/40 hover:text-brand-red self-start"
                          >
                            ✕
                          </button>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>

                {items.length > 0 && (
                  <div className="border-t border-black/5 px-6 py-5">
                    <div className="flex justify-between text-sm mb-4">
                      <span className="text-black/60">Subtotal</span>
                      <span className="font-semibold">${total}</span>
                    </div>
                    <button className="w-full h-12 bg-brand-black text-white font-semibold tracking-widest uppercase text-sm rounded-lg hover:bg-brand-red transition-colors">
                      Checkout
                    </button>
                  </div>
                )}
              </motion.div>
            </>
          )}
        </AnimatePresence>
      );
    }

    // Main App
    function App() {
      const [showPreloader, setShowPreloader] = useState(true);
      const [view, setView] = useState("rack"); // rack | pdp
      const [selected, setSelected] = useState(null);
      const [cart, setCart] = useState([]);
      const [cartOpen, setCartOpen] = useState(false);

      const handleSelect = (hoodie) => {
        setSelected(hoodie);
        setView("pdp");
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const handleAddToCart = (item) => {
        setCart((prev) => [...prev, item]);
        setCartOpen(true);
      };

      const handleRemove = (idx) => {
        setCart((prev) => prev.filter((_, i) => i !== idx));
      };

      return (
        <>
          <AnimatePresence>
            {showPreloader && (
              <Preloader onComplete={() => setShowPreloader(false)} />
            )}
          </AnimatePresence>

          {!showPreloader && (
            <motion.div
              initial={{ opacity: 0 }}
              animate={{ opacity: 1 }}
              transition={{ duration: 0.5 }}
            >
              <Ticker />
              <Header cartCount={cart.length} onOpenCart={() => setCartOpen(true)} />

              <AnimatePresence mode="wait">
                {view === "rack" ? (
                  <motion.div
                    key="rack"
                    initial={{ opacity: 0 }}
                    animate={{ opacity: 1 }}
                    exit={{ opacity: 0, y: -20 }}
                    transition={{ duration: 0.35 }}
                  >
                    <ClothesRail onSelectProduct={handleSelect} />

                    {/* Simple footer teaser */}
                    <section className="border-t border-black/5 py-16 text-center">
                      <p className="text-xs tracking-[0.3em] uppercase text-black/40 mb-2">Next Drop</p>
                      <p className="font-display text-2xl font-bold tracking-tight">Coming Soon</p>
                    </section>
                  </motion.div>
                ) : (
                  <ProductDetail
                    key="pdp"
                    product={selected}
                    onBack={() => setView("rack")}
                    onAddToCart={handleAddToCart}
                  />
                )}
              </AnimatePresence>

              <CartDrawer
                open={cartOpen}
                onClose={() => setCartOpen(false)}
                items={cart}
                onRemove={handleRemove}
              />
            </motion.div>
          )}
        </>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
