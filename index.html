                  <img src={product.img} alt={productName} className="absolute inset-0 w-full h-full object-cover select-none" draggable={false} />
                  <div className="absolute inset-0 pointer-events-none" style={{
                    background: face === "side" ? "linear-gradient(90deg, rgba(0,0,0,0.25) 0%, transparent 40%)" : face === "back" ? "rgba(0,0,0,0.12)" : "transparent"
                  }} />
                </div>
              </div>
              <div className="mt-5 flex items-center gap-3 px-1">
                <span className="text-[10px] font-bold tracking-widest text-black/40 min-w-[32px]">360°</span>
                <input type="range" min="0" max="360" value={rotation} onChange={e => setRotation(+e.target.value)} className="flex-1 cursor-grab active:cursor-grabbing" />
                <span className="text-[10px] font-medium text-black/30 min-w-[36px] text-right">{Math.round(rotation)}°</span>
              </div>
              <div className="mt-3 flex gap-2">
                <button onClick={() => { setViewMode("2d"); setRotation(0); }} className={`px-4 py-2 rounded-full text-xs font-semibold tracking-wide transition-all ${viewMode === "2d" ? "bg-brand-black text-white shadow-md" : "bg-white border border-black/10 text-black/60"}`}>2D VIEW</button>
                <button onClick={() => setViewMode("3d")} className={`px-4 py-2 rounded-full text-xs font-semibold tracking-wide transition-all flex items-center gap-1.5 ${viewMode === "3d" ? "bg-brand-black text-white shadow-md" : "bg-white border border-black/10 text-black/60"}`}>
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>
                  3D MODEL
                </button>
              </div>
            </div>
            <div className="flex flex-col">
              <div className="flex items-start justify-between gap-4">
                <h2 className="font-display text-2xl sm:text-3xl font-bold tracking-tight uppercase leading-tight">{productName}</h2>
                <span className="text-2xl font-bold whitespace-nowrap">${productPrice}</span>
              </div>
              <div className="mt-3 flex items-center gap-3 text-xs">
                <span className="bg-emerald-100 text-emerald-700 font-semibold px-2.5 py-1 rounded-full">{t.inStock}</span>
                <span className="text-black/50 font-medium">{t.shipsIn}</span>
              </div>
              <p className="mt-5 text-sm text-black/65 leading-relaxed max-w-md">{t.desc}</p>
              <div className="mt-8">
                <div className="flex items-center justify-between mb-3">
                  <span className="text-xs font-bold tracking-widest uppercase">{t.selectSize}</span>
                  <button className="text-[11px] font-medium text-black/45 underline hover:text-brand-red">{t.sizeGuide}</button>
                </div>
                <div className="flex gap-2">
                  {["S", "M", "L", "XL"].map(s => (
                    <button key={s} onClick={() => setSize(s)} className={`w-12 h-12 rounded-lg border-2 text-sm font-semibold transition-all ${size === s ? "border-brand-red bg-brand-red text-white" : "border-black/15 hover:border-black/40"}`}>{s}</button>
                  ))}
                </div>
              </div>
              <button onClick={handleAdd} disabled={isAdding} className="mt-8 w-full h-14 bg-brand-black text-white font-semibold tracking-widest uppercase text-sm rounded-lg hover:-translate-y-0.5 hover:shadow-xl active:translate-y-0 transition-all duration-200 disabled:opacity-70">
                {isAdding ? t.added : `${t.addToBag} — $${productPrice}`}
              </button>
              <ul className="mt-8 space-y-3 text-sm text-black/65">
                <li className="flex items-center gap-3"><span className="w-5 h-5 rounded-full bg-black/5 flex items-center justify-center text-[10px]">✓</span>{t.cotton}</li>
                <li className="flex items-center gap-3"><span className="w-5 h-5 rounded-full bg-black/5 flex items-center justify-center text-[10px]">✓</span>{t.freeExpress}</li>
                <li className="flex items-center gap-3"><span className="w-5 h-5 rounded-full bg-black/5 flex items-center justify-center text-[10px]">✓</span>{t.returns}</li>
              </ul>
            </div>
          </div>
        </motion.div>
      );
    }

    function CartDrawer({ open, onClose, items, onRemove, t, lang }) {
      const total = items.reduce((s, i) => s + i.price, 0);
      return (
        <AnimatePresence>
          {open && (
            <>
              <motion.div className="fixed inset-0 bg-black/40 z-[60]" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} onClick={onClose} />
              <motion.div className="fixed top-0 end-0 h-full w-full max-w-md bg-white z-[70] shadow-2xl flex flex-col"
                initial={{ x: lang === 'ar' ? "-100%" : "100%" }} animate={{ x: 0 }} exit={{ x: lang === 'ar' ? "-100%" : "100%" }}
                transition={{ type: "spring", stiffness: 300, damping: 30 }}>
                <div className="flex items-center justify-between px-6 h-16 border-b border-black/5">
                  <h3 className="font-display font-bold text-lg tracking-tight">{t.yourBag}</h3>
                  <button onClick={onClose} className="text-xs font-semibold tracking-widest hover:text-brand-red">{t.close}</button>
                </div>
                <div className="flex-1 overflow-y-auto px-6 py-4">
                  {items.length === 0 ? (
                    <p className="text-sm text-black/45 mt-10 text-center">{t.emptyBag}</p>
                  ) : (
                    <ul className="space-y-4">
                      {items.map((item, idx) => (
                        <li key={idx} className="flex gap-4">
                          {item.img ? <img src={item.img} alt="" className="w-14 h-[72px] rounded-md flex-shrink-0 object-cover" /> :
                            <div className="w-14 h-[72px] rounded-md flex-shrink-0" style={{ background: `linear-gradient(160deg, ${item.color || '#333'} 0%, ${item.accent || '#111'} 100%)` }} />}
                          <div className="flex-1 min-w-0">
                            <p className="text-sm font-semibold truncate">{item.name || "Product"}</p>
                            <p className="text-xs text-black/45 mt-0.5">{item.size || ""}</p>
                            <p className="text-sm font-medium mt-1">${item.price}</p>
                          </div>
                          <button onClick={() => onRemove(idx)} className="text-xs text-black/35 hover:text-brand-red self-start">✕</button>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>
                {items.length > 0 && (
                  <div className="border-t border-black/5 px-6 py-5">
                    <div className="flex justify-between text-sm mb-4">
                      <span className="text-black/55">{t.subtotal}</span>
                      <span className="font-semibold">${total}</span>
                    </div>
                    <button className="w-full h-12 bg-brand-black text-white font-semibold tracking-widest uppercase text-sm rounded-lg hover:bg-brand-red transition-colors">{t.checkout}</button>
                  </div>
                )}
              </motion.div>
            </>
          )}
        </AnimatePresence>
      );
    }

    function Footer({ t }) {
      return (
        <footer className="border-t border-black/5 py-10 text-center">
          <p className="font-display font-bold text-sm tracking-tight mb-2"><span className="text-brand-red">STAY</span> HUSTLE</p>
          <p className="text-xs text-black/40">{t.footerRights}</p>
        </footer>
      );
    }

    function App() {
      const [lang, setLang] = useState("en");
      const [showPreloader, setShowPreloader] = useState(true);
      const [view, setView] = useState("home");
      const [selected, setSelected] = useState(null);
      const [cart, setCart] = useState([]);
      const [cartOpen, setCartOpen] = useState(false);
      const t = translations[lang];
      const dir = lang === "ar" ? "rtl" : "ltr";
      useEffect(() => {
        document.documentElement.lang = lang;
        document.documentElement.dir = dir;
        document.body.className = `font-sans text-brand-black antialiased ${lang === "ar" ? "font-arabic" : ""}`;
      }, [lang, dir]);
      const handleSelect = (item) => {
        const product = item.price ? item : { ...item, name: `STAY HUSTLE ${item.label || ""} Hoodie`, nameAr: `هودي STAY HUSTLE ${item.labelAr || item.label || ""}`, price: 115 };
        setSelected(product);
        setView("pdp");
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
      const handleAddToCart = (item) => { setCart(prev => [...prev, item]); setCartOpen(true); };
      const handleRemove = (idx) => setCart(prev => prev.filter((_, i) => i !== idx));
      return (
        <>
          <AnimatePresence>{showPreloader && <Preloader onComplete={() => setShowPreloader(false)} />}</AnimatePresence>
          {!showPreloader && (
            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ duration: 0.4 }}>
              <Ticker t={t} />
              <Header t={t} cartCount={cart.length} onOpenCart={() => setCartOpen(true)} lang={lang} setLang={setLang} dir={dir} />
              <AnimatePresence mode="wait">
                {view === "home" ? (
                  <motion.div key="home" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0, y: -12 }} transition={{ duration: 0.3 }}>
                    <ClothesRail onSelectProduct={handleSelect} t={t} />
                    <ProductGrid t={t} lang={lang} onAdd={handleAddToCart} onView={handleSelect} />
                    <AboutSection t={t} />
                    <Footer t={t} />
                  </motion.div>
                ) : (
                  <ProductDetail key="pdp" product={selected} onBack={() => setView("home")} onAddToCart={handleAddToCart} t={t} lang={lang} />
                )}
              </AnimatePresence>
              <CartDrawer open={cartOpen} onClose={() => setCartOpen(false)} items={cart} onRemove={handleRemove} t={t} lang={lang} />
            </motion.div>
          )}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
