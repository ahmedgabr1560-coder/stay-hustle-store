function Product3DViewer({ imgUrl }) {
  const mountRef = useRef(null);
  const stateRef = useRef({ dragging: false, prevX: 0, prevY: 0, rotY: 0, rotX: 0 });
  useEffect(() => {
    if (!mountRef.current || !window.THREE) return;
    const THREE = window.THREE;
    const el = mountRef.current;
    const w = el.clientWidth || 400, h = el.clientHeight || 500;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf3f3f3);
    const camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
    camera.position.set(0, 0, 3.2);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    el.innerHTML = "";
    el.appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const dirL = new THREE.DirectionalLight(0xffffff, 0.5);
    dirL.position.set(2, 3, 4);
    scene.add(dirL);
    const group = new THREE.Group();
    scene.add(group);
    const loader = new THREE.TextureLoader();
    loader.crossOrigin = "anonymous";
    loader.load(imgUrl, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      const aspect = (tex.image && tex.image.width) ? tex.image.width / tex.image.height : 0.75;
      const planeH = 2.2, planeW = planeH * aspect;
      const geo = new THREE.PlaneGeometry(planeW, planeH);
      const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.65, metalness: 0.02 });
      const front = new THREE.Mesh(geo, mat);
      front.position.z = 0.04;
      group.add(front);
      const back = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, color: 0xbbbbbb }));
      back.rotation.y = Math.PI;
      back.position.z = -0.04;
      group.add(back);
      group.add(new THREE.Mesh(new THREE.BoxGeometry(planeW, planeH, 0.08), new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 })));
    }, undefined, () => {
      group.add(new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.9, 0.12), new THREE.MeshStandardMaterial({ color: 0x333333 })));
    });
    const st = stateRef.current;
    const onDown = (e) => { st.dragging = true; st.prevX = e.clientX || (e.touches && e.touches[0].clientX) || 0; st.prevY = e.clientY || (e.touches && e.touches[0].clientY) || 0; };
    const onMove = (e) => {
      if (!st.dragging) return;
      const x = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      const y = e.clientY || (e.touches && e.touches[0].clientY) || 0;
      st.rotY += (x - st.prevX) * 0.01;
      st.rotX = Math.max(-0.85, Math.min(0.85, st.rotX + (y - st.prevY) * 0.006));
      st.prevX = x; st.prevY = y;
    };
    const onUp = () => { st.dragging = false; };
    el.addEventListener("mousedown", onDown);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    el.addEventListener("touchstart", onDown, { passive: true });
    window.addEventListener("touchmove", onMove, { passive: true });
    window.addEventListener("touchend", onUp);
    let frame;
    const animate = () => {
      frame = requestAnimationFrame(animate);
      // NO auto-spin — only user drag
      group.rotation.y = st.rotY;
      group.rotation.x = st.rotX;
      renderer.render(scene, camera);
    };
    animate();
    const onResize = () => {
      const nw = el.clientWidth, nh = el.clientHeight;
      if (!nw || !nh) return;
      camera.aspect = nw / nh; camera.updateProjectionMatrix(); renderer.setSize(nw, nh);
    };
    window.addEventListener("resize", onResize);
    return () => {
      cancelAnimationFrame(frame);
      el.removeEventListener("mousedown", onDown);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      window.removeEventListener("resize", onResize);
      renderer.dispose();
      if (el.contains(renderer.domElement)) el.removeChild(renderer.domElement);
    };
  }, [imgUrl]);
  return <div ref={mountRef} className="absolute inset-0 w-full h-full cursor-grab active:cursor-grabbing touch-none" />;
}

          </div>
          <div className="mt-3 flex gap-2">
            <button onClick={() => setViewMode("2d")} className={`px-4 py-2 rounded-full text-xs font-semibold ${viewMode === "2d" ? "bg-brand-black text-white" : "bg-white border border-black/10 text-black/60"}`}>2D</button>
            <button onClick={() => setViewMode("3d")} className={`px-4 py-2 rounded-full text-xs font-semibold ${viewMode === "3d" ? "bg-brand-black text-white" : "bg-white border border-black/10 text-black/60"}`}>3D</button>
          </div>
        </div>
        <div className="flex flex-col">
          <div className="flex items-start justify-between gap-4">
            <h2 className="font-display text-2xl sm:text-3xl font-bold tracking-tight uppercase">{productName}</h2>
            <span className="text-2xl font-bold">${productPrice}</span>
          </div>
          <div className="mt-3 flex items-center gap-3 text-xs">
            <span className="bg-emerald-100 text-emerald-700 font-semibold px-2.5 py-1 rounded-full">{t.inStock}</span>
            <span className="text-black/50">{t.shipsIn}</span>
          </div>
          <p className="mt-5 text-sm text-black/65 leading-relaxed">{t.desc}</p>
          <div className="mt-8">
            <div className="flex items-center justify-between mb-3">
              <span className="text-xs font-bold tracking-widest uppercase">{t.selectSize}</span>
              <button className="text-[11px] text-black/45 underline">{t.sizeGuide}</button>
            </div>
            <div className="flex gap-2">
              {["S","M","L","XL"].map(s => (
                <button key={s} onClick={() => setSize(s)} className={`w-12 h-12 rounded-lg border-2 text-sm font-semibold ${size === s ? "border-brand-red bg-brand-red text-white" : "border-black/15"}`}>{s}</button>
              ))}
            </div>
          </div>
          <button onClick={handleAdd} disabled={isAdding} className="mt-8 w-full h-14 bg-brand-black text-white font-semibold tracking-widest uppercase text-sm rounded-lg hover:-translate-y-0.5 hover:shadow-xl transition-all disabled:opacity-70">
            {isAdding ? t.added : `${t.addToBag} — $${productPrice}`}
          </button>
          <ul className="mt-8 space-y-3 text-sm text-black/65">
            <li className="flex items-center gap-3"><span className="w-5 h-5 rounded-full bg-black/5 flex items-center justify-center text-[10px]">✓</span>{t.cotton}</li>
            <li className="flex items-center gap-3"><span className="w-5 h-5 rounded-full bg-black/5 flex items-center justify-center text-[10px]">✓</span>{t.freeExpress}</li>
            <li className="flex items-center gap-3"><span className="w-5 h-5 rounded-full bg-black/5 flex items-center justify-center text-[10px]">✓</span>{t.returns}</li>
          </ul>
        </div>
      </div>
    </motion.div>
  );
}

function CartDrawer({ open, onClose, items, onRemove, t, lang }) {
  const total = items.reduce((s, i) => s + i.price, 0);
  return (
    <AnimatePresence>
      {open && (
        <>
          <motion.div className="fixed inset-0 bg-black/40 z-[60]" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} onClick={onClose} />
          <motion.div className="fixed top-0 end-0 h-full w-full max-w-md bg-white z-[70] shadow-2xl flex flex-col"
            initial={{ x: lang === 'ar' ? "-100%" : "100%" }} animate={{ x: 0 }} exit={{ x: lang === 'ar' ? "-100%" : "100%" }}
            transition={{ type: "spring", stiffness: 300, damping: 30 }}>
            <div className="flex items-center justify-between px-6 h-16 border-b border-black/5">
              <h3 className="font-display font-bold text-lg">{t.yourBag}</h3>
              <button onClick={onClose} className="text-xs font-semibold tracking-widest hover:text-brand-red">{t.close}</button>
            </div>
            <div className="flex-1 overflow-y-auto px-6 py-4">
              {items.length === 0 ? <p className="text-sm text-black/45 mt-10 text-center">{t.emptyBag}</p> : (
                <ul className="space-y-4">
                  {items.map((item, idx) => (
                    <li key={idx} className="flex gap-4">
                      {item.img ? <img src={item.img} alt="" className="w-14 h-[72px] rounded-md object-cover" /> : <div className="w-14 h-[72px] rounded-md bg-gray-300" />}
                      <div className="flex-1 min-w-0">
                        <p className="text-sm font-semibold truncate">{item.name}</p>
                        <p className="text-xs text-black/45">{item.size || ""}</p>
                        <p className="text-sm font-medium mt-1">${item.price}</p>
                      </div>
                      <button onClick={() => onRemove(idx)} className="text-xs text-black/35 hover:text-brand-red">✕</button>
                    </li>
                  ))}
                </ul>
              )}
            </div>
            {items.length > 0 && (
              <div className="border-t border-black/5 px-6 py-5">
                <div className="flex justify-between text-sm mb-4"><span className="text-black/55">{t.subtotal}</span><span className="font-semibold">${total}</span></div>
                <button onClick={() => { alert(lang === 'ar' ? `تم استلام طلبك! المجموع: $${total}` : `Order received! Total: $${total}`); onClose(); }}
                  className="w-full h-12 bg-brand-black text-white font-semibold tracking-widest uppercase text-sm rounded-lg hover:bg-brand-red">{t.checkout}</button>
              </div>
            )}
          </motion.div>
        </>
      )}
    </AnimatePresence>
  );
}

function Footer({ t }) {
  return (
    <footer className="border-t border-black/5 py-10 text-center">
      <p className="font-display font-bold text-sm mb-2"><span className="text-brand-red">STAY</span> HUSTLE</p>
      <p className="text-xs text-black/40">{t.footerRights}</p>
    </footer>
  );
}

function App() {
  const [lang, setLang] = useState("en");
  const [showPreloader, setShowPreloader] = useState(true);
  const [view, setView] = useState("home");
  const [selected, setSelected] = useState(null);
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const t = translations[lang];
  const dir = lang === "ar" ? "rtl" : "ltr";
  useEffect(() => {
    document.documentElement.lang = lang;
    document.documentElement.dir = dir;
    document.body.className = `font-sans text-brand-black antialiased ${lang === "ar" ? "font-arabic" : ""}`;
  }, [lang, dir]);
  const handleSelect = (item) => {
    const product = item.price ? item : { ...item, name: `STAY HUSTLE ${item.label || ""}`, nameAr: `STAY HUSTLE ${item.labelAr || item.label || ""}`, price: 115 };
    setSelected(product); setView("pdp"); window.scrollTo({ top: 0, behavior: "smooth" });
  };
  const handleAddToCart = (item) => { setCart(prev => [...prev, item]); setCartOpen(true); };
  const handleRemove = (idx) => setCart(prev => prev.filter((_, i) => i !== idx));
  return (
    <>
      <AnimatePresence>{showPreloader && <Preloader onComplete={() => setShowPreloader(false)} />}</AnimatePresence>
      {!showPreloader && (
        <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ duration: 0.4 }}>
          <Ticker t={t} />
          <Header t={t} cartCount={cart.length} onOpenCart={() => setCartOpen(true)} lang={lang} setLang={setLang} dir={dir} />
          <AnimatePresence mode="wait">
            {view === "home" ? (
              <motion.div key="home" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
                <ClothesRail onSelectProduct={handleSelect} t={t} />
                <ProductGrid t={t} lang={lang} onAdd={handleAddToCart} onView={handleSelect} />
                <AboutSection t={t} />
                <Footer t={t} />
              </motion.div>
            ) : (
              <ProductDetail key="pdp" product={selected} onBack={() => setView("home")} onAddToCart={handleAddToCart} t={t} lang={lang} />
            )}
          </AnimatePresence>
          <CartDrawer open={cartOpen} onClose={() => setCartOpen(false)} items={cart} onRemove={handleRemove} t={t} lang={lang} />
        </motion.div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
